[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(900px 400px at 80% -10%,#1fa452,transparent 60%),linear-gradient(160deg,var(--g2),var(--gd))}
.lcard{width:100%;max-width:380px;background:#fff;border-radius:26px;padding:26px 22px;text-align:center;box-shadow:0 30px 60px rgba(0,0,0,.3)}
.lcard .lg{width:170px;height:100px;margin:0 auto;background:var(--logo) center/contain no-repeat}
.lcard h1{font-family:var(--nas);font-size:1.45rem;line-height:2;margin:4px 0 0;color:var(--gd)}
.lcard p{color:var(--mut);margin:0 0 16px;font-size:.92rem}
.code{width:100%;text-align:center;font-family:var(--lat);font-size:1.5rem;letter-spacing:.12em;border:2px solid var(--line);border-radius:16px;padding:12px;direction:ltr;background:#fffdf8}
.code:focus{outline:none;border-color:var(--g)}
.big{width:100%;margin-top:12px;background:var(--g);color:#fff;border-radius:16px;padding:13px;font-weight:700;font-size:1.08rem;box-shadow:0 10px 22px rgba(11,107,50,.3)}
.big:disabled{opacity:.6}
.err{margin-top:12px;background:#fde2e2;color:#9b0018;border-radius:12px;padding:8px 12px;font-size:.92rem}
.help{display:inline-block;margin-top:16px;color:var(--g);font-weight:600;font-size:.92rem}
/* top */
.top{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.top .wrap{display:flex;align-items:center;gap:10px;height:62px}
.top .lg{width:64px;height:40px;background:#fff var(--logo) center/86% auto no-repeat;border-radius:999px;flex:none}
.who{flex:1;min-width:0;line-height:1.4}.who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{opacity:.85;font-size:.78rem}
.ib{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none;position:relative}
.ib svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.menu{position:absolute;top:50px;left:0;background:#fff;color:var(--ink);border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.2);min-width:180px;overflow:hidden;z-index:30}
.menu button{display:block;width:100%;text-align:right;padding:12px 16px;border-bottom:1px solid var(--line)}
/* controls */
.shopbox{margin:14px 0 0;background:#fff;border:2px solid var(--s);border-radius:16px;padding:10px 12px}
.shopbox label{font-size:.85rem;color:var(--mut)}.shopbox input{width:100%;border:0;font-weight:700;font-size:1.05rem;padding:2px 0}
.shopbox input:focus{outline:none}
.packs{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}.packs::-webkit-scrollbar{display:none}
.pk{flex:none;border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 16px;font-weight:600;white-space:nowrap}
.pk.on{background:var(--g);border-color:var(--g);color:#fff}
.pk em{font-style:normal;font-size:.75rem;opacity:.7;margin-inline-start:4px}
.search{position:relative;margin:8px 0 2px}
.search input{width:100%;border:2px solid var(--line);border-radius:14px;padding:10px 40px 10px 12px;background:#fff}
.search input:focus{outline:none;border-color:var(--g)}
.search svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--mut);fill:none;stroke-width:2}
.srow{display:flex;gap:8px;align-items:center;margin:8px 0 2px}.srow .search{flex:1;margin:0}
.vt{flex:none;border:2px solid var(--line);background:#fff;border-radius:14px;padding:9px 12px;font-weight:700;font-size:.85rem;color:var(--g);white-space:nowrap}
.grid.compact{grid-template-columns:1fr 1fr!important;gap:8px!important}
.compact .it{border:1.5px solid #9cc9ae;border-radius:12px;padding:8px 8px 6px!important;gap:3px;text-align:center}
.compact .it h3{font-size:.9rem;line-height:1.45;min-height:2.6em;display:flex;align-items:center;justify-content:center}
.compact .cd{font-family:var(--lat);font-size:.72rem;color:var(--r);font-weight:600;direction:ltr}
.compact .meta{justify-content:center;gap:8px}
.compact .step button{width:32px;height:30px;font-size:1.1rem}
.compact .step input{width:38px;font-size:.95rem}
.compact .unit{display:none}
.ratehint{font-size:.85rem;color:var(--mut);margin:6px 2px 0}
/* grid */
.grid{list-style:none;margin:12px 0 0;padding:0 0 120px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
@media(max-width:400px){.grid{grid-template-columns:1fr 1fr}}
.it{background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:6px;transition:.15s}
.it.has{border-color:var(--g);box-shadow:0 0 0 2px var(--g) inset}
.it h3{margin:0;font-size:.95rem;line-height:1.5}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:4px;font-size:.8rem;color:var(--mut)}
.price{font-family:var(--lat);font-weight:700;color:var(--g);font-size:1rem}
.price.call{font-family:var(--nsk);color:var(--r);font-size:.82rem}
.step{display:flex;align-items:center;justify-content:space-between;background:var(--cream);border-radius:12px;padding:3px}
.step button{width:38px;height:36px;border-radius:10px;background:#fff;font-size:1.3rem;font-weight:700;color:var(--g);box-shadow:0 1px 0 var(--line)}
.step button.plus{background:var(--g);color:#fff}
.step input{width:46px;text-align:center;border:0;background:transparent;font-family:var(--lat);font-weight:700;font-size:1.05rem}
.step input:focus{outline:none}
.unit{font-size:.72rem;color:var(--mut);text-align:center;margin-top:-4px}
/* pouch */
.pouch{position:relative;aspect-ratio:4/4.2;border-radius:9px;overflow:hidden;
background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.22) 0 2px,transparent 3px) 0 0/12px 12px,linear-gradient(180deg,color-mix(in srgb,var(--c) 60%,#fff) 0%,var(--c) 30%,color-mix(in srgb,var(--c) 80%,#000) 46%,#fffaf0 46.6%,#efe4cc 78%,var(--g) 78.5%,var(--gd) 100%)}
.pouch:before,.pouch:after{content:"";position:absolute;left:0;right:0;height:8px;z-index:3;background:linear-gradient(135deg,#fff 33%,transparent 34%) 0 0/8px 8px,linear-gradient(225deg,#fff 33%,transparent 34%) 0 0/8px 8px}
.pouch:before{top:-1px}.pouch:after{bottom:-1px;transform:rotate(180deg)}
.pouch .l{position:absolute;top:9%;left:18%;right:18%;height:22%;border-radius:50%;background:#fff var(--logo) center/86% auto no-repeat;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.pouch .tag{position:absolute;top:34%;left:8%;right:8%;background:#fff;border:2px solid var(--s);border-radius:7px;font-size:.66rem;font-weight:700;color:var(--gd);text-align:center;line-height:1.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px}
.pouch .heap{position:absolute;left:8%;right:8%;bottom:21%;height:32%;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3));
background:radial-gradient(ellipse 40% 66% at 50% 78%,color-mix(in srgb,var(--c) 80%,#fff) 0 30%,var(--c) 55% 95%,transparent 97%),radial-gradient(ellipse 50% 20% at 50% 84%,#fff 0 94%,transparent 96%)}
.pouch .pk2{position:absolute;bottom:4%;left:0;right:0;text-align:center;color:#fff;font-size:.68rem;font-weight:700}
/* bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--cream) 30%)}

.bar .n{background:rgba(255,255,255,.2);border-radius:999px;padding:0 10px;font-size:.85rem}

.ov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}

.tot{display:flex;justify-content:space-between;font-weight:700;font-size:1.15rem;margin:12px 0}
.tot .lat{color:var(--g)}
textarea{width:100%;border:2px solid var(--line);border-radius:14px;padding:10px;min-height:64px;resize:vertical}
.warn{background:#fff3cd;color:#7a5a00;border-radius:12px;padding:8px 12px;font-size:.88rem;margin-top:8px}
/* done */
.done{text-align:center;padding:30px 10px}
.done .ok{width:84px;height:84px;border-radius:50%;background:var(--g);color:#fff;font-size:2.6rem;display:grid;place-items:center;margin:0 auto 10px;box-shadow:0 14px 30px rgba(11,107,50,.35)}
.done h2{font-family:var(--nas);font-size:1.5rem;line-height:2;margin:0}
.done .no{display:inline-block;font-family:var(--lat);font-weight:700;font-size:1.3rem;background:var(--cream);border:2px dashed var(--s);border-radius:12px;padding:4px 14px;margin:8px 0}
.wa{background:#25D366!important;box-shadow:0 10px 22px rgba(37,211,102,.35)!important}
.ghost{width:100%;margin-top:10px;border:2px solid var(--g);color:var(--g);border-radius:16px;padding:11px;font-weight:700}
/* orders */
.oc{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-top:10px}

.oc .lat{font-weight:700}
.st{border-radius:999px;padding:0 12px;font-size:.82rem;font-weight:700}
.st-نیا{background:#fff3cd;color:#7a5a00}.st-کنفرم{background:#e3f6e8;color:var(--g)}.st-روانہ{background:#e0ecff;color:#1d4ed8}.st-مکمل{background:#e3f6e8;color:var(--gd)}.st-کینسل{background:#fde2e2;color:#9b0018}
.oc pre{white-space:pre-wrap;font-family:var(--nsk);font-size:.88rem;color:var(--mut);margin:6px 0;line-height:1.8}
.oc footer{display:flex;justify-content:space-between;font-size:.88rem}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--g);animation:sp 1s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-size:.9rem;box-shadow:0 10px 24px rgba(0,0,0,.25)}
</style></head>

$('lf').addEventListener('submit',function(e){e.preventDefault();login(normCode($('code').value),true)});

function login(code,manual){
  if(!/^BP-\d{6}$/.test(code)){showErr('پورا کوڈ لکھیں، مثلاً BP-123456');return}
  S.code=code;$('lbtn').disabled=true;$('lbtn').textContent='انتظار کریں…';$('lerr').hidden=true;
  call('login').then(function(r){
    $('lbtn').disabled=false;$('lbtn').textContent='اندر جائیں';
    if(!r.ok){ls('bp_code',null);showLogin();showErr(r.msg);return}
    ls('bp_code',code);S.user=r.user;S.items=r.items;S.shops=r.shops||[];
    try{var c=JSON.parse(ls('bp_cart_'+code)||'{}');S.cart={};S.items.forEach(function(i){if(c[i.id])S.cart[i.id]=c[i.id]})}catch(e){S.cart={}}
    start();
  }).catch(function(){$('lbtn').disabled=false;$('lbtn').textContent='اندر جائیں';showLogin();showErr('انٹرنیٹ کا مسئلہ، دوبارہ کوشش کریں')});
}
function ltrNums(m){return esc(m).replace(/(\d[\d -]{5,}\d)/g,'<bdi dir="ltr" class="lat" style="white-space:nowrap">$1</bdi>')}
function showErr(m){$('lerr').innerHTML=ltrNums(m);$('lerr').hidden=false}
function showLogin(){$('login').hidden=false;$('app').hidden=true}
function start(){
  $('login').hidden=true;$('app').hidden=false;
  $('uname').textContent=S.user.name;$('utype').textContent=S.user.type+' · '+S.user.code;
  var ot=S.user.type==='آرڈر ٹیکر';$('shopBox').hidden=!ot;
  $('shopList').innerHTML=S.shops.map(function(s){return '<option value="'+esc(s.name)+'">'+esc(s.area||'')+'</option>'}).join('');
  if(ot)$('shopName').value=ls('bp_shop')||'';
  var packs=[];S.items.forEach(function(i){if(packs.indexOf(i.pack)<0)packs.push(i.pack)});
  if(packs.indexOf(S.pack)<0)S.pack=packs[0]||'';
  $('packs').innerHTML=packs.map(function(p){var n=S.items.filter(function(i){return i.pack===p}).length;return '<button class="pk'+(p===S.pack?' on':'')+'" data-p="'+esc(p)+'">'+esc(p)+'<em class="lat">'+n+'</em></button>'}).join('');
  view('shop');renderGrid();renderBar();
}
$('packs').addEventListener('click',function(e){var b=e.target.closest('[data-p]');if(!b)return;S.pack=b.dataset.p;[].forEach.call(this.children,function(x){x.classList.toggle('on',x===b)});$('q').value='';S.q='';renderGrid();window.scrollTo({top:0,behavior:'smooth'})});
$('q').addEventListener('input',function(){S.q=this.value.trim();renderGrid()});
$('shopName').addEventListener('input',function(){ls('bp_shop',this.value)});

function pouch(i){var c=(COL[i.name]||['#b5702f'])[0];return '<div class="pouch" style="--c:'+c+'"><i class="l"></i><span class="tag">'+esc(i.name)+'</span><span class="heap"></span><span class="pk2">'+esc(i.pack)+'</span></div>'}
function renderGrid(){
  var list=S.items.filter(function(i){return S.q?i.name.indexOf(S.q)>-1:i.pack===S.pack});
  var cp=S.view==='c';$('grid').classList.toggle('compact',cp);$('vt').textContent=cp?'🖼 تصویر':'☰ چھوٹا';
  if(!list.length){$('grid').innerHTML='<li class="empty" style="grid-column:1/-1">کچھ نہیں ملا</li>';return}
  var price=function(i){return i.rate===null?'<span class="price call">ریٹ کال پر</span>':'<span class="price">'+fmt(i.rate)+'</span>'};
  var step=function(q){return '<div class="step"><button class="minus" data-d="-1" aria-label="کم">−</button><input class="qty" inputmode="numeric" value="'+(q||'')+'" placeholder="0" aria-label="تعداد"><button class="plus" data-d="1" aria-label="زیادہ">+</button></div>'};
  $('grid').innerHTML=list.map(function(i){var q=S.cart[i.id]||0;
    if(cp)return '<li class="it'+(q?' has':'')+'" data-id="'+i.id+'"><h3>'+esc(i.name)+'</h3><div class="cd">'+esc(i.id.toUpperCase())+(S.q?' · '+esc(i.pack):'')+'</div><div class="meta">'+price(i)+'<span>/ '+esc(i.unit)+'</span></div>'+step(q)+'</li>';
    return '<li class="it'+(q?' has':'')+'" data-id="'+i.id+'">'+pouch(i)+'<h3>'+esc(i.name)+'</h3>'+
    '<div class="meta"><span>'+(S.q?esc(i.pack)+' · ':'')+'فی '+esc(i.unit)+'</span>'+price(i)+'</div>'+
    (i.face?'<div class="meta"><span>پرچون</span><span class="lat">'+fmt(i.face)+'</span></div>':'')+
    step(q)+'<div class="unit">'+esc(i.unit)+'</div></li>'}).join('');
}
$('vt').addEventListener('click',function(){S.view=S.view==='c'?'p':'c';ls('bp_view',S.view);renderGrid()});
function setQty(id,q){q=Math.max(0,Math.min(9999,Math.floor(Number(q)||0)));if(q)S.cart[id]=q;else delete S.cart[id];ls('bp_cart_'+S.code,JSON.stringify(S.cart));renderBar()}
function itemById(id){for(var k=0;k<S.items.length;k++)if(S.items[k].id===id)return S.items[k]}
function bindSteps(root,rerender){
  root.addEventListener('click',function(e){var b=e.target.closest('[data-d]');if(!b)return;var li=b.closest('[data-id]'),id=li.dataset.id;setQty(id,(S.cart[id]||0)+Number(b.dataset.d));rerender(li,id)});
  root.addEventListener('change',function(e){if(!e.target.classList.contains('qty'))return;var li=e.target.closest('[data-id]'),id=li.dataset.id;setQty(id,e.target.value);rerender(li,id)});
}
bindSteps($('grid'),function(li,id){var q=S.cart[id]||0;li.querySelector('.qty').value=q||'';li.classList.toggle('has',!!q)});
function totals(){var n=0,t=0,p=false,c=0;for(var id in S.cart){var i=itemById(id);if(!i)continue;c++;n+=S.cart[id];if(i.rate===null)p=true;else t+=S.cart[id]*i.rate}return{n:n,t:t,p:p,c:c}}
function renderBar(){var T=totals();$('bar').hidden=!T.c||!$('ordersView').hidden;$('bn').textContent=T.c+' چیزیں';$('bt').textContent=fmt(T.t)+(T.p?' +':'')}
$('cartBtn').addEventListener('click',openCart);
function openCart(){
  var ids=Object.keys(S.cart);if(!ids.length)return;
  var ot=S.user.type==='آرڈر ٹیکر',shop=$('shopName').value.trim();
  $('cshop').hidden=!ot;$('cshop').textContent=shop?'دکان: '+shop:'⚠️ اوپر دکان کا نام لکھیں';
  $('crows').innerHTML=ids.map(function(id){var i=itemById(id),q=S.cart[id];if(!i)return'';
    return '<div class="row" data-id="'+id+'"><div><b><span class="lat" style="color:var(--r);font-size:.75rem">['+esc(i.id.toUpperCase())+']</span> '+esc(i.name)+'</b><small>'+esc(i.pack)+' · '+(i.rate===null?'ریٹ کال پر':fmt(i.rate)+' فی '+esc(i.unit))+'</small></div><div class="amt">'+(i.rate===null?'—':fmt(q*i.rate))+'</div>'+
    '<div class="step"><button class="minus" data-d="-1">−</button><input class="qty" inputmode="numeric" value="'+q+'"><button class="plus" data-d="1">+</button></div></div>'}).join('');
  var T=totals();$('ctot').textContent=fmt(T.t);$('cpend').hidden=!T.p;$('cerr').hidden=true;$('cart').hidden=false;
}
bindSteps($('crows'),function(){if(!Object.keys(S.cart).length){$('cart').hidden=true;renderGrid();return}openCart();renderGrid()});
document.addEventListener('click',function(e){if(e.target.matches('[data-close]')||e.target.classList.contains('ov')){e.target.closest('.ov').hidden=true}});
$('send').addEventListener('click',function(){
  var ot=S.user.type==='آرڈر ٹیکر',shop=$('shopName').value.trim();
  if(ot&&!shop){$('cerr').textContent='پہلے دکان کا نام لکھیں';$('cerr').hidden=false;return}
  var cart=Object.keys(S.cart).map(function(id){return{id:id,qty:S.cart[id]}});
  var btn=this;btn.disabled=true;btn.textContent='بھیجا جا رہا ہے…';
  call('order',{cart:cart,shop:shop,note:$('note').value}).then(function(r){
    btn.disabled=false;btn.textContent='✅ آرڈر بھیجیں';
    if(!r.ok){if(r.err==='blocked'||r.err==='code'){logout();showErr(r.msg);return}$('cerr').innerHTML=ltrNums(r.msg);$('cerr').hidden=false;return}
    S.cart={};ls('bp_cart_'+S.code,null);$('note').value='';$('cart').hidden=true;renderGrid();renderBar();
    $('dno').textContent=r.no;$('dtot').textContent='کل رقم: '+fmt(r.total)+(r.pending?' + باقی ریٹ کال پر':'');
    var msg='*بابو پلس آرڈر* '+r.no+'\n'+(S.user.type==='آرڈر ٹیکر'?'بکر: '+S.user.name+'\n':'')+'دکان: '+r.shop+'\n\n'+r.items.join('\n')+'\n\nکل: '+fmt(r.total)+(r.pending?' + باقی':'');
    $('dwa').onclick=function(){window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(msg),'_blank')};
    $('done').hidden=false;
  }).catch(function(){btn.disabled=false;btn.textContent='✅ آرڈر بھیجیں';$('cerr').textContent='انٹرنیٹ کا مسئلہ، دوبارہ بھیجیں';$('cerr').hidden=false});
});
function view(v){$('shopView').hidden=v!=='shop';$('ordersView').hidden=v!=='orders';renderBar();if(v==='orders')loadOrders();window.scrollTo(0,0)}
function loadOrders(){
  $('olist').innerHTML='<div class="spin"></div>';
  call('myorders').then(function(r){
    if(!r.ok){if(r.err){logout();showErr(r.msg)}return}
    if(!r.orders.length){$('olist').innerHTML='<div class="empty">ابھی کوئی آرڈر نہیں</div>';return}
    $('olist').innerHTML=r.orders.map(function(o){return '<div class="oc"><header><span class="lat">'+esc(o.no)+'</span><span class="st st-'+esc(o.status)+'">'+esc(o.status)+'</span></header><small style="color:var(--mut)">'+esc(o.date)+(S.user.type==='آرڈر ٹیکر'?' · '+esc(o.shop):'')+'</small><pre>'+esc(o.items)+'</pre><footer><span>'+esc(o.count)+' عدد</span><b class="lat">Rs '+esc(o.total)+'</b></footer></div>'}).join('');
  }).catch(function(){$('olist').innerHTML='<div class="empty">انٹرنیٹ کا مسئلہ</div>'});
}
$('ordersBtn').addEventListener('click',function(){view($('ordersView').hidden?'orders':'shop')});
$('menuBtn').addEventListener('click',function(e){if(e.target.closest('[data-m]'))return;$('menu').hidden=!$('menu').hidden});
$('menu').addEventListener('click',function(e){var b=e.target.closest('[data-m]');if(!b)return;$('menu').hidden=true;var m=b.dataset.m;
  if(m==='out'){if(confirm('باہر نکلنا ہے؟'))logout()}else if(m==='refresh'){login(S.code)}else view(m)});
function logout(){ls('bp_code',null);S.user=null;$('code').value='';showLogin()}
S.view=ls('bp_view')||'c';var saved=ls('bp_code');if(saved){$('code').value=saved;login(saved)}
})();
</script>
</body></html>
