document.documentElement.lang='ur';
var st={li:0,cart:{},q:'',edit:false,draft:null,eli:0,canEdit:false,saving:false,msg:''};
var form={name:'',shopName:'',addr:'',phone:''};
try{var f=JSON.parse(localStorage.getItem('bp_form')||'null');if(f)form=Object.assign(form,f);}catch(e){}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(v){return Number(v||0).toLocaleString('en-US');}
function rs(v){return '<span class="num">Rs '+fmt(v)+'</span>';}
function n(v){return '<span class="num">'+v+'</span>';}
function cartLines(){var out=[];DATA.lines.forEach(function(L){L.items.forEach(function(it){var q=st.cart[L.key+'|'+it.id]||0;if(q>0&&it.on)out.push({it:it,L:L,q:q,amt:q*L.rate});});});return out;}
function totals(lines){var t=0,d=0;lines.forEach(function(x){t+=x.amt;d+=x.q;});return {t:t,d:d};}
function waHref(lines){
  var T=totals(lines),t='السلام علیکم! Babu Plus آرڈر\n';
  t+='نام: '+form.name+'\n';if(form.shopName)t+='دکان: '+form.shopName+'\n';t+='پتہ: '+form.addr+'\n';if(form.phone)t+='فون: '+form.phone+'\n';
  DATA.lines.forEach(function(L){var xs=lines.filter(function(x){return x.L===L;});if(!xs.length)return;
    t+='\n*'+L.label+'* (Rs '+L.rate+' فی درجن)\n';xs.forEach(function(x){t+='• '+x.it.name+' × '+x.q+' درجن = Rs '+fmt(x.amt)+'\n';});});
  t+='\nکل: '+T.d+' درجن · Rs '+fmt(T.t);
  return 'https://wa.me/'+DATA.shop.phone+'?text='+encodeURIComponent(t);
}
function okToSend(lines){return lines.length&&form.name.trim()&&form.addr.trim();}
function viewShop(){
  var L=DATA.lines[st.li],lines=cartLines(),T=totals(lines),per=Math.round(L.rate/12*100)/100;
  var h='<header class="top"><div class="brand"><img class="logo" src="'+LOGO+'" alt="Babu Plus"><p>'+esc(DATA.shop.tagline)+'</p></div><div class="side"><span class="stamp">ریٹ بتاریخ '+n(esc(DATA.updated))+'</span>';
  if(st.canEdit)h+='<button class="admin-btn" data-a="edit">ریٹ بدلیں</button>';
  h+='</div></header>';
  if(DATA.note)h+='<div class="note">'+esc(DATA.note)+'</div>';
  h+='<div class="tabs" role="group" aria-label="ساشے کی قسم">';
  DATA.lines.forEach(function(x,i){h+='<button class="tab" data-a="line" data-i="'+i+'" aria-pressed="'+(st.li===i)+'">'+n(x.key)+' روپے<small>'+n(x.items.length)+' آئٹم</small></button>';});
  h+='</div><div class="ratecard"><div class="main"><b>'+rs(L.rate)+'</b><span>دکاندار ریٹ فی درجن</span></div><div><b>'+rs(per)+'</b><span>فی پیس</span></div><div><b>'+rs(L.retail-L.rate)+'</b><span>منافع فی درجن</span></div>';
  h+='<p>ایک درجن = '+n(12)+' ساشے · آگے '+n(L.key)+' روپے فی پیس بیچیں (کل '+rs(L.retail)+')</p></div>';
  h+='<div class="search"><input id="q" data-a2="q" placeholder="چیز تلاش کریں…" value="'+esc(st.q)+'"></div><div class="list" id="list">'+listHtml()+'</div>';
  h+='<h2 id="order">آرڈر کی تفصیل</h2><div class="form">';
  h+='<label for="f_name">آپ کا نام *<input id="f_name" data-f="name" value="'+esc(form.name)+'" autocomplete="name"></label>';
  h+='<label for="f_shop">دکان کا نام<input id="f_shop" data-f="shopName" value="'+esc(form.shopName)+'"></label>';
  h+='<label for="f_addr">پتہ / علاقہ *<input id="f_addr" data-f="addr" value="'+esc(form.addr)+'"></label>';
  h+='<label for="f_phone">فون نمبر<input id="f_phone" data-f="phone" value="'+esc(form.phone)+'" inputmode="tel" style="direction:ltr;text-align:right"></label></div>';
  h+='<div class="summary" id="sum">'+summaryHtml(lines)+'</div>';
  var ok=okToSend(lines);
  h+='<a class="wa" id="wa" target="_blank" rel="noopener" href="'+(ok?esc(waHref(lines)):'#')+'" aria-disabled="'+(!ok)+'">WhatsApp پر آرڈر بھیجیں</a>';
  h+='<p class="hint" id="wahint">'+hintText(ok)+'</p>';
  h+='<div class="contact"><div>WhatsApp: '+n(esc(DATA.shop.phoneShow))+'<button data-a="copy">نمبر کاپی کریں</button></div><div>'+esc(DATA.shop.address)+'</div><div class="num">'+esc(DATA.shop.social)+'</div></div>';
  h+='<div class="bar"><div class="in"><div class="t" id="bart">'+rs(T.t)+'<small>'+n(T.d)+' درجن</small></div><a href="#order">آرڈر مکمل کریں</a></div></div>';
  return h;
}
function hintText(ok){return ok?'بٹن دبانے پر WhatsApp کھلے گا، وہاں Send دبائیں۔':'آرڈر بھیجنے کے لیے سامان چنیں اور نام اور پتہ لکھیں۔';}
function listHtml(){
  var L=DATA.lines[st.li],q=st.q.trim(),h='',c=0;
  L.items.forEach(function(it,i){if(q&&it.name.indexOf(q)<0)return;c++;var k=L.key+'|'+it.id,v=st.cart[k]||0;
    h+='<div class="row'+(it.on?'':' off')+(v?' has':'')+'"><span class="no num">'+String(i+1).padStart(2,'0')+'</span><span class="name">'+esc(it.name)+(it.on?'':' <small>(ابھی دستیاب نہیں)</small>')+'</span>';
    if(it.on)h+='<div class="step"><button data-a="minus" data-k="'+k+'" aria-label="کم کریں">−</button><span class="q num">'+v+'</span><button class="plus" data-a="plus" data-k="'+k+'" aria-label="زیادہ کریں">+</button></div>';
    h+='</div>';});
  return c?h:'<div class="row"><span class="hint">کوئی چیز نہیں ملی۔</span></div>';
}
function summaryHtml(lines){
  if(!lines.length)return '<span class="hint">ابھی کوئی چیز نہیں چنی گئی۔ تینوں ٹیب سے چیزیں ملا کر آرڈر کر سکتے ہیں۔</span>';
  var T=totals(lines),h='';lines.forEach(function(x){h+='<div class="l"><span>'+esc(x.it.name)+' ('+n(x.L.key)+') × '+n(x.q)+' درجن</span>'+rs(x.amt)+'</div>';});
  return h+'<div class="l tot"><span>کل ('+n(T.d)+' درجن)</span>'+rs(T.t)+'</div>';
}
function refreshOrder(){
  var lines=cartLines(),T=totals(lines),ok=okToSend(lines);
  var s=document.getElementById('sum');if(s)s.innerHTML=summaryHtml(lines);
  var a=document.getElementById('wa');if(a){a.setAttribute('href',ok?waHref(lines):'#');a.setAttribute('aria-disabled',String(!ok));}
  var hn=document.getElementById('wahint');if(hn)hn.textContent=hintText(ok);
  var b=document.getElementById('bart');if(b)b.innerHTML=rs(T.t)+'<small>'+n(T.d)+' درجن</small>';
}
function viewEdit(){
  var d=st.draft,L=d.lines[st.eli];
  var h='<header class="top"><div class="brand"><img class="logo" src="'+LOGO+'" alt="Babu Plus"><p>ریٹ لسٹ بدلیں، پھر محفوظ کریں۔</p></div></header>';
  h+='<label for="e_note">اوپر والا پیغام (خالی چھوڑیں تو نظر نہیں آئے گا)<input id="e_note" data-e="note" value="'+esc(d.note)+'"></label>';
  h+='<div class="tabs">';d.lines.forEach(function(x,i){h+='<button class="tab" data-a="eline" data-i="'+i+'" aria-pressed="'+(st.eli===i)+'">'+n(x.key)+' روپے<small>'+n(x.items.length)+' آئٹم</small></button>';});h+='</div>';
  h+='<div class="ecard"><div class="two"><label for="e_rate">دکاندار ریٹ فی درجن<input id="e_rate" data-e="rate" inputmode="numeric" value="'+esc(L.rate)+'"></label><label for="e_retail">ٹوٹل سیل فی درجن<input id="e_retail" data-e="retail" inputmode="numeric" value="'+esc(L.retail)+'"></label></div></div>';
  h+='<div class="ecard">';
  L.items.forEach(function(it,i){h+='<div class="erow"><span class="num">'+String(i+1).padStart(2,'0')+'</span><input type="text" id="e_n_'+L.key+'_'+i+'" data-e="name" data-i="'+i+'" value="'+esc(it.name)+'" aria-label="نام"><label for="e_o_'+L.key+'_'+i+'" style="display:flex;align-items:center;gap:4px"><input type="checkbox" id="e_o_'+L.key+'_'+i+'" data-e="on" data-i="'+i+'"'+(it.on?' checked':'')+'>موجود</label><button class="btn x" data-a="del" data-i="'+i+'" aria-label="ہٹائیں">✕</button></div>';});
  h+='<button class="btn" data-a="add">+ نئی چیز</button></div>';
  h+='<div class="bar"><div class="in"><span class="msg">'+esc(st.msg)+'</span><div style="display:flex;gap:8px"><button class="btn" data-a="cancel">واپس</button><button class="btn primary" data-a="save"'+(st.saving?' disabled':'')+'>'+(st.saving?'محفوظ ہو رہا ہے…':'محفوظ کریں')+'</button></div></div></div>';
  return h;
}
function render(){app.innerHTML=st.edit?viewEdit():viewShop();}
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;var a=b.getAttribute('data-a');
  if(a==='line'){st.li=Number(b.getAttribute('data-i'));st.q='';render();}
  else if(a==='plus'||a==='minus'){var k=b.getAttribute('data-k');st.cart[k]=Math.max(0,(st.cart[k]||0)+(a==='plus'?1:-1));document.getElementById('list').innerHTML=listHtml();refreshOrder();}
  else if(a==='copy'){try{navigator.clipboard.writeText(DATA.shop.phoneShow).then(function(){b.textContent='کاپی ہو گیا';},function(){});}catch(x){}}
  else if(a==='edit'){st.draft=JSON.parse(JSON.stringify(DATA));st.eli=st.li;st.edit=true;st.msg='';render();window.scrollTo(0,0);}
  else if(a==='eline'){st.eli=Number(b.getAttribute('data-i'));render();}
  else if(a==='cancel'){st.edit=false;render();}
  else if(a==='add'){var L=st.draft.lines[st.eli];L.items.push({id:L.key+'-n'+Date.now(),name:'نئی چیز',on:true});render();}
  else if(a==='del'){st.draft.lines[st.eli].items.splice(Number(b.getAttribute('data-i')),1);render();}
  else if(a==='save'){save();}
});
app.addEventListener('input',function(e){
  var t=e.target;
  if(t.getAttribute('data-a2')==='q'){st.q=t.value;document.getElementById('list').innerHTML=listHtml();return;}
  var f=t.getAttribute('data-f');
  if(f){form[f]=t.value;try{localStorage.setItem('bp_form',JSON.stringify(form));}catch(x){}refreshOrder();return;}
  var k=t.getAttribute('data-e');if(!k)return;var d=st.draft,L=d.lines[st.eli];
  function num(v){return Number(String(v).replace(/[^0-9.]/g,''))||0;}
  if(k==='note')d.note=t.value;
  else if(k==='rate')L.rate=num(t.value);
  else if(k==='retail')L.retail=num(t.value);
  else{var it=L.items[Number(t.getAttribute('data-i'))];if(k==='name')it.name=t.value;else if(k==='on')it.on=t.checked;}
});
var RESET=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
var FONTS='<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@600;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap">';
function buildDoc(d){
  var css=document.getElementById('s').textContent,js=document.getElementById('main').textContent;
  var json=JSON.stringify(d).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
    '<title>بابو پلس آرڈر</title>'+FONTS+'<style id="s">'+css+'</style><div id="app"></div><script id="data" type="application/json">'+json+'<\/script><script id="main">'+js+'<\/script></body></html>';
}
var artifactNs=null;
function today(){var x=new Date();return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}
function save(){
  if(!artifactNs){st.msg='محفوظ کرنے کی اجازت نہیں ملی۔';render();return;}
  var d=JSON.parse(JSON.stringify(st.draft));d.lines.forEach(function(L){L.items=L.items.filter(function(it){return it.name.trim();});});d.updated=today();
  st.saving=true;st.msg='';render();
  artifactNs.publish(buildDoc(d)).then(function(){st.msg='محفوظ ہو گیا';},function(err){st.saving=false;
    st.msg=(err&&err.code==='conflict')?'کسی اور جگہ سے تبدیلی ہوئی، صفحہ نیا لوڈ ہو رہا ہے۔':'محفوظ نہیں ہو سکا، دوبارہ کوشش کریں۔';render();});
}
render();
if(window.claude&&window.claude.use){
  window.claude.use('user').then(function(u){return u?u.canEdit():false;}).then(function(c){
    if(!c)return;return window.claude.use('artifact').then(function(ns){artifactNs=ns;if(ns){st.canEdit=true;if(!st.edit)render();}});
  }).catch(function(){});
}
})();
</script>
</body></html>
